name: Python tests

on:
  push:
    branches:
      - main
      - feat/21-validation-and-notes
      - feat/22-search-and-insights
  pull_request:
    branches:
      - main
      - feat/21-validation-and-notes

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q campusflow main.py tests
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
